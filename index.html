<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock, paper, scissors!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--========================
    ==========CONTAINER========-->
    <div id="container">
      <div class="titleRow">
        <span class="line"></span>
        <span class="diamond"></span>
        <h1 class="title">
          Rock,paper,scissors!
        </h1>
        <span class="diamond"></span>
        <span class="line"></span>
      </div>
      <h3 class="subtitle">
        <span class="diamond"></span> Choose your move
        <span class="diamond"></span>
      </h3>

      <div id="incomingMove"></div>
      <br /><br />

      <div id="choices">
        <button type="button" id="rockBtn">
          <img src="/rock.png" alt="rock" width="30" height="30" class="rock" />
        </button>
        <button type="button" id="paperBtn">
          <img
            src="/paper.png"
            alt="paper"
            width="30"
            height="30"
            class="paper"
          />
        </button>
        <button type="button" id="scissorsBtn">
          <img
            src="/scissors.png"
            alt="scissors"
            width="30"
            height="30"
            class="scissors"
          />
        </button>
      </div>
      <br />
      <div id="result"></div>

      <div id="score">
        <p id="player">Player: <span id="playerScore">0</span></p>
        <p id="computer">Computer: <span id="computerScore">0</span></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
